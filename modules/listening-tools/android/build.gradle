plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.listeningtools'
version = '0.0.1'
android {
  namespace 'expo.modules.listeningtools'
  defaultConfig { versionCode 1; versionName '0.0.1' }
}
dependencies {
  implementation project(':silence-trim')
  implementation project(':alac-decoder')
  implementation 'androidx.media3:media3-extractor:1.9.0'
}
